name: Status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Load previous data
        run: |
          git fetch origin data --depth=1 2>/dev/null && git show origin/data:status.json > prev.json || echo '{}' > prev.json

      - name: Run checks and build site
        env:
          SERVERS_JSON: ${{ secrets.SERVERS_JSON }}
        run: |
          mkdir -p site
          cp -r public/* site/
          node scripts/check.js prev.json site/status.json

      - name: Save data
        run: |
          d=$(mktemp -d)
          cp site/status.json "$d/status.json"
          cd "$d"
          git init -q -b data
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add status.json
          git commit -qm "status $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
